{% extends 'base.html' %}

{% block title %}{{ module_name }} – FitAI Coach{% endblock %}

{% block content %}
<section class="placeholder-section py-6">
    <div class="container text-center">
        <div class="glass-card placeholder-card" style="max-width: 600px; margin: 2rem auto; padding: 3rem 2rem;">
            <div class="feature-icon icon-emerald" style="font-size: 3rem; width: 80px; height: 80px; margin: 0 auto 1.5rem auto;">
                {{ icon }}
            </div>

            <span class="welcome-badge mb-2" style="display: inline-block;">{{ tag }}</span>
            <h1 class="welcome-title" style="font-size: 2.2rem; margin-top: 0.5rem;">{{ module_name }}</h1>

            <p class="card-desc mt-3" style="font-size: 1.05rem; color: var(--text-muted); line-height: 1.6;">
                {{ description }}
            </p>

            <div class="placeholder-badge-row mt-4" style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
                <span class="feature-tag">Extensible Blueprint Ready</span>
                <span class="feature-tag">SQLite Schema Configured</span>
            </div>

            <div class="mt-5">
                <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    <span>Return to Dashboard</span>
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
