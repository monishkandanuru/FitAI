{% extends 'workspace.html' %}{% block title %}Account settings · FitAI{% endblock %}{% block workspace %}<header class="page-intro"><p class="eyebrow">Your account</p><h1>Make it yours.</h1><p>Update your name or change your password.</p></header>
<form method="post" class="glass-card editor-card narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="full_name">Full name</label><input name="full_name" id="full_name" value="{{ user.full_name }}" maxlength="100" required autocomplete="name"><label for="current_password">Current password</label><input name="current_password" id="current_password" type="password" required autocomplete="current-password"><label for="new_password">New password (optional)</label><input name="new_password" id="new_password" type="password" minlength="8" maxlength="128" autocomplete="new-password"><label for="confirm_password">Confirm new password</label><input name="confirm_password" id="confirm_password" type="password" minlength="8" maxlength="128" autocomplete="new-password"><button class="btn btn-primary">Save changes</button></form>{% endblock %}
